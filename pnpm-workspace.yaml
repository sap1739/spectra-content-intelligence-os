packages:
  - apps/*
  - packages/*

allowBuilds:
  # Dev/test only: these packages carry a prebuilt ffmpeg so the video tests can
  # encode real video. Nothing ships them — the worker uses the host's own
  # ffmpeg via FFMPEG_PATH (ADR-0041, OPEN_SOURCE_AND_LICENSE_POLICY.md §3).
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/darwin-x64': true
  '@ffmpeg-installer/linux-arm64': true
  '@ffmpeg-installer/linux-x64': true
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/darwin-x64': true
  '@ffprobe-installer/linux-arm64': true
  '@ffprobe-installer/linux-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  # Scarf is analytics/telemetry — no build needed.
  '@scarf/scarf': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  # Native addon used by BullMQ's msgpackr.
  msgpackr-extract: true
  prisma: true
  # Arrives via the OpenTelemetry OTLP exporter (Phase 6B); its postinstall
  # builds the protobuf codecs the exporter uses on the wire.
  protobufjs: true
  sharp: true
  unrs-resolver: true
